<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>De moed om het Zwarte Schaap te zijn — AR</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .a-enter-vr { display: none !important; }

    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.72);
      color: #D4AF37;
      font-family: Georgia, serif;
      text-align: center;
    }

    #startButton {
      border: 1px solid rgba(212,175,55,0.85);
      border-radius: 999px;
      background: rgba(0,0,0,0.86);
      color: #f5d76e;
      padding: 16px 22px;
      font-family: Georgia, serif;
      font-size: 18px;
      letter-spacing: 0.3px;
      box-shadow: 0 0 24px rgba(212,175,55,0.35);
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 9999;
      width: max-content;
      max-width: 86vw;
      padding: 10px 14px;
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 999px;
      background: rgba(0,0,0,0.58);
      color: #f5d76e;
      font-family: Georgia, serif;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="startOverlay">
    <button id="startButton">Tik om AR met geluid te starten</button>
  </div>

  <div id="hint">Richt je camera op de markering in het boek</div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <video id="vid1" src="https://wowbooks.github.io/zwarte-schaap/zs001.mp4"
        preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid2" src="https://wowbooks.github.io/zwarte-schaap/zs002.mp4"
        preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid3" src="https://wowbooks.github.io/zwarte-schaap/zs003.mp4"
        preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid4" src="https://wowbooks.github.io/zwarte-schaap/zs004.mp4"
        preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs001.patt" id="m1">
      <a-video src="#vid1" width="1.6" height="0.9" position="0 0.1 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs002.patt" id="m2">
      <a-video src="#vid2" width="1.6" height="0.9" position="0 0.1 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs003.patt" id="m3">
      <a-video src="#vid3" width="1.6" height="0.9" position="0 0.1 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs004.patt" id="m4">
      <a-video src="#vid4" width="1.6" height="0.9" position="0 0.1 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('startOverlay');
    const startButton = document.getElementById('startButton');

    const markers = ['m1','m2','m3','m4'];
    const videos  = ['vid1','vid2','vid3','vid4'];

    let soundUnlocked = false;

    startButton.addEventListener('click', async function () {
      soundUnlocked = true;
      startOverlay.style.display = 'none';
      // Unlock audio op iOS door alle videos kort te starten
      videos.forEach(id => {
        const v = document.getElementById(id);
        v.muted = false;
        v.volume = 1;
        v.play().catch(() => {});
        v.pause();
      });
    });

    markers.forEach(function(mid, i) {
      const marker = document.getElementById(mid);
      const vid = document.getElementById(videos[i]);

      marker.addEventListener('markerFound', function () {
        if (soundUnlocked) vid.muted = false;
        vid.play().catch(() => {});
      });

      marker.addEventListener('markerLost', function () {
        vid.pause();
      });
    });
  </script>
</body>
</html>
