<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De moed om het Zwarte Schaap te zijn – AR</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      #ui-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 30px;
      }
      #hint {
        color: rgba(255,255,255,0.75);
        font-family: 'Georgia', serif;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-align: center;
        padding: 10px 20px;
        background: rgba(0,0,0,0.45);
        border-radius: 20px;
      }
    </style>

    <!-- AR.js + A-Frame -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body>

    <div id="ui-overlay">
      <div id="hint">Richt je camera op de markering in het boek</div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
    >

      <!-- Marker 20 → zs001.mp4 -->
      <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs001.patt" id="m1">
        <a-video
          src="#vid1"
          width="2" height="1.125"
          position="0 0.1 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <!-- Marker 21 → zs002.mp4 -->
      <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs002.patt" id="m2">
        <a-video
          src="#vid2"
          width="2" height="1.125"
          position="0 0.1 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <!-- Marker 22 → zs003.mp4 -->
      <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs003.patt" id="m3">
        <a-video
          src="#vid3"
          width="2" height="1.125"
          position="0 0.1 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <!-- Marker 23 → zs004.mp4 -->
      <a-marker type="pattern" url="https://wowbooks.github.io/zwarte-schaap/zs004.patt" id="m4">
        <a-video
          src="#vid4"
          width="2" height="1.125"
          position="0 0.1 0"
          rotation="-90 0 0"
        ></a-video>
      </a-marker>

      <!-- Video assets -->
      <a-assets>
        <video id="vid1" src="https://wowbooks.github.io/zwarte-schaap/zs001.mp4"
          preload="auto" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="vid2" src="https://wowbooks.github.io/zwarte-schaap/zs002.mp4"
          preload="auto" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="vid3" src="https://wowbooks.github.io/zwarte-schaap/zs003.mp4"
          preload="auto" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="vid4" src="https://wowbooks.github.io/zwarte-schaap/zs004.mp4"
          preload="auto" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
      </a-assets>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // iOS autoplay: play video when marker is found
      ['m1','m2','m3','m4'].forEach(function(id, i) {
        var marker = document.getElementById(id);
        var vid = document.getElementById('vid' + (i+1));
        marker.addEventListener('markerFound', function() {
          vid.play().catch(function(){});
        });
        marker.addEventListener('markerLost', function() {
          vid.pause();
        });
      });
    </script>

  </body>
</html>
