<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Test AR</title>

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .a-enter-vr { display: none !important; }
    #startOverlay {
      position: fixed; inset: 0; z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.72); color: #D4AF37; font-family: Georgia, serif;
    }
    #startButton {
      border: 1px solid rgba(212,175,55,0.85); border-radius: 999px;
      background: rgba(0,0,0,0.86); color: #f5d76e;
      padding: 16px 22px; font-family: Georgia, serif; font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <button id="startButton">Tik om AR te starten</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-assets>
      <video id="vid1" src="https://wowbooks.github.io/zwarte-schaap/zs001.mp4"
        preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-marker preset="hiro" id="m1">
      <a-video src="#vid1" width="1.6" height="0.9" position="0 0.1 0" rotation="-90 0 0"></a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('startOverlay');
    const startButton = document.getElementById('startButton');
    const vid = document.getElementById('vid1');
    const marker = document.getElementById('m1');

    startButton.addEventListener('click', function () {
      startOverlay.style.display = 'none';
      vid.muted = false;
      vid.volume = 1;
    });

    marker.addEventListener('markerFound', function () {
      vid.muted = false;
      vid.play().catch(() => {});
    });

    marker.addEventListener('markerLost', function () {
      vid.pause();
    });
  </script>
</body>
</html>
