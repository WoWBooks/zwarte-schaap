<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR Camera Test</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .a-enter-vr { display: none !important; }
    #msg {
      position: fixed; top: 20px; left: 0; right: 0;
      text-align: center; color: #f5d76e;
      font-family: Georgia, serif; font-size: 16px;
      z-index: 9999; padding: 10px;
      background: rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="msg">Laden...</div>

  <a-scene
    mindar-image="imageTargetSrc: https://wowbooks.github.io/zwarte-schaap/targets.mind;"
    embedded
    vr-mode-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box color="red" position="0 0 0" scale="0.5 0.5 0.5"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const msg = document.getElementById('msg');

    sceneEl.addEventListener('loaded', () => msg.textContent = 'Camera actief — richt op marker');
    sceneEl.addEventListener('targetFound', () => msg.textContent = '✅ Marker herkend!');
    sceneEl.addEventListener('targetLost', () => msg.textContent = 'Camera actief — richt op marker');
  </script>
</body>
</html>
