<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR Test 3</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    .a-enter-vr { display: none !important; }
    #cameraFeed {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #msg {
      position: fixed; top: 20px; left: 0; right: 0;
      text-align: center; color: #f5d76e;
      font-family: Georgia, serif; font-size: 16px;
      z-index: 9999; padding: 10px;
      background: rgba(0,0,0,0.6);
      pointer-events: none;
    }
    #startOverlay {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9);
    }
    #startButton {
      border: 1px solid rgba(212,175,55,0.85); border-radius: 999px;
      background: rgba(0,0,0,0.86); color: #f5d76e;
      padding: 16px 28px; font-family: Georgia, serif; font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <button id="startButton">Tik om te starten</button>
  </div>

  <video id="cameraFeed" autoplay playsinline webkit-playsinline muted></video>
  <div id="msg">Laden...</div>

  <a-scene
    mindar-image="imageTargetSrc: https://wowbooks.github.io/zwarte-schaap/targets.mind; autoStart: false;"
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box color="red" position="0 0 0" scale="0.5 0.5 0.5"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const startButton = document.getElementById('startButton');
    const startOverlay = document.getElementById('startOverlay');
    const msg = document.getElementById('msg');
    const cameraFeed = document.getElementById('cameraFeed');
    const sceneEl = document.querySelector('a-scene');

    startButton.addEventListener('click', async function() {
      startOverlay.style.display = 'none';
      msg.textContent = 'Camera starten...';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        cameraFeed.srcObject = stream;
        await cameraFeed.play();
        msg.textContent = 'Camera actief — richt op marker';

        // Start MindAR
        const arSystem = sceneEl.systems['mindar-image-system'];
        arSystem.start();

      } catch(e) {
        msg.textContent = 'Fout: ' + e.message;
      }
    });

    sceneEl.addEventListener('targetFound', () => msg.textContent = '✅ Marker herkend!');
    sceneEl.addEventListener('targetLost', () => msg.textContent = 'Camera actief — richt op marker');
  </script>
</body>
</html>
