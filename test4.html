<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR Test 4</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #container { width: 100%; height: 100%; position: relative; }
    #msg {
      position: fixed; top: 20px; left: 0; right: 0;
      text-align: center; color: #f5d76e;
      font-family: Georgia, serif; font-size: 16px;
      z-index: 9999; padding: 10px;
      background: rgba(0,0,0,0.6);
      pointer-events: none;
    }
    #startOverlay {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9);
    }
    #startButton {
      border: 1px solid rgba(212,175,55,0.85); border-radius: 999px;
      background: rgba(0,0,0,0.86); color: #f5d76e;
      padding: 16px 28px; font-family: Georgia, serif; font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <button id="startButton">Tik om te starten</button>
  </div>
  <div id="msg">Laden...</div>
  <div id="container"></div>

  <script>
    const startButton = document.getElementById('startButton');
    const startOverlay = document.getElementById('startOverlay');
    const msg = document.getElementById('msg');

    startButton.addEventListener('click', async function() {
      startOverlay.style.display = 'none';
      msg.textContent = 'Camera starten...';

      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.getElementById('container'),
        imageTargetSrc: 'https://wowbooks.github.io/zwarte-schaap/targets.mind',
      });

      const { renderer, scene, camera } = mindarThree;

      await mindarThree.start();
      msg.textContent = 'Camera actief — richt op marker';

      const anchor = mindarThree.addAnchor(0);
      anchor.onTargetFound = () => { msg.textContent = '✅ Marker herkend!'; };
      anchor.onTargetLost = () => { msg.textContent = 'Camera actief — richt op marker'; };

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    });
  </script>
</body>
</html>
