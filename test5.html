<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR Test 5</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .a-enter-vr { display: none !important; }

    /* Forceer MindAR video canvas zichtbaar */
    a-scene { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; }
    canvas { position: fixed !important; top: 0 !important; left: 0 !important; }
    video { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; object-fit: cover !important; z-index: 0 !important; }

    #msg {
      position: fixed; top: 20px; left: 0; right: 0;
      text-align: center; color: #f5d76e;
      font-family: Georgia, serif; font-size: 16px;
      z-index: 9999; padding: 10px;
      background: rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #startOverlay {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.9);
    }
    #startButton {
      border: 1px solid rgba(212,175,55,0.85); border-radius: 999px;
      background: rgba(0,0,0,0.86); color: #f5d76e;
      padding: 16px 28px; font-family: Georgia, serif; font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="startOverlay">
    <button id="startButton">Tik om te starten</button>
  </div>
  <div id="msg">Laden...</div>

  <a-scene
    mindar-image="imageTargetSrc: https://wowbooks.github.io/zwarte-schaap/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="target0">
      <a-box color="#D4AF37" position="0 0 0" scale="0.3 0.3 0.3"></a-box>
    </a-entity>
  </a-scene>

  <script>
    const startButton = document.getElementById('startButton');
    const startOverlay = document.getElementById('startOverlay');
    const msg = document.getElementById('msg');
    const sceneEl = document.querySelector('a-scene');
    const target = document.getElementById('target0');

    startButton.addEventListener('click', async function() {
      startOverlay.style.display = 'none';
      msg.textContent = 'Camera starten...';

      // Wacht tot scene geladen is
      sceneEl.addEventListener('loaded', async () => {
        const arSystem = sceneEl.systems['mindar-image-system'];
        await arSystem.start();
        msg.textContent = 'Camera actief — richt op marker';

        // Maak alle video elementen zichtbaar
        setTimeout(() => {
          document.querySelectorAll('video').forEach(v => {
            v.style.display = 'block';
            v.style.position = 'fixed';
            v.style.top = '0';
            v.style.left = '0';
            v.style.width = '100%';
            v.style.height = '100%';
            v.style.objectFit = 'cover';
            v.style.zIndex = '1';
          });
        }, 1000);
      });

      target.addEventListener('targetFound', () => msg.textContent = '✅ Marker herkend!');
      target.addEventListener('targetLost', () => msg.textContent = 'Camera actief — richt op marker');
    });
  </script>
</body>
</html>
