<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>De moed om het Zwarte Schaap te zijn — Video 1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; font-family: Georgia, serif; }
    #laadscherm {
      position: fixed; inset: 0; background: #0a0805;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 9999; text-align: center; padding: 2rem;
      transition: opacity 1s ease;
    }
    #laadscherm .titel { font-size: 10px; letter-spacing: 0.25em; color: rgba(200,168,74,0.5); text-transform: uppercase; margin-bottom: 1.5rem; }
    #laadscherm p { font-size: 14px; color: #c8b890; font-style: italic; line-height: 1.8; margin-bottom: 2rem; }
    #laadscherm button { background: transparent; border: 0.5px solid rgba(200,168,74,0.5); color: rgba(200,168,74,0.9); font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.2em; padding: 14px 32px; cursor: pointer; text-transform: uppercase; }
    #herhaal { position: fixed; bottom: 2rem; right: 1.5rem; background: rgba(0,0,0,0.6); border: 0.5px solid rgba(200,168,74,0.3); color: rgba(200,168,74,0.6); font-family: Georgia, serif; font-size: 10px; letter-spacing: 0.15em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; z-index: 999; display: none; }
  </style>
</head>
<body>

<div id="laadscherm">
  <p class="titel">De moed om het Zwarte Schaap te zijn</p>
  <p>Words of Wholeness</p>
  <p style="font-size:11px; color:rgba(200,168,74,0.4); letter-spacing:0.1em; line-height:1.9;">
    Richt camera op de Hiro marker<br>
    Houd stil op 30cm afstand
  </p>
  <button onclick="startAR()">✦ &nbsp; Start AR</button>
</div>

<button id="herhaal" onclick="location.reload()">↺ Opnieuw</button>

<a-scene id="arscene" embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true;"
  style="display:none">

  <a-assets>
    <video id="vid"
      src="https://wowbooks.github.io/zwarte-schaap/zs001.mp4"
      preload="auto" playsinline webkit-playsinline crossorigin="anonymous" loop></video>
  </a-assets>

  <a-marker preset="hiro" id="marker">

    <a-video src="#vid"
      width="3.2" height="1.8"
      position="0 0.01 0"
      rotation="-90 0 0"
      opacity="0"
      animation__verschijn="property: opacity; from: 0; to: 1; dur: 1500; delay: 200; easing: easeInOutSine"
      animation__zweef="property: position; from: 0 0.01 0; to: 0 0.12 0; dur: 3500; delay: 200; dir: alternate; loop: true; easing: easeInOutSine"
    ></a-video>

    <a-sphere color="#c8a84a" opacity="0.8" radius="0.018" position="-0.5 0.02 -0.3"
      animation="property: position; from: -0.5 0.02 -0.3; to: -0.55 0.45 -0.3; dur: 3000; loop: true; easing: easeInSine"
    ></a-sphere>
    <a-sphere color="#c8a84a" opacity="0.6" radius="0.012" position="0.5 0.02 0.3"
      animation="property: position; from: 0.5 0.02 0.3; to: 0.6 0.55 0.3; dur: 4000; loop: true; easing: easeInSine"
    ></a-sphere>
    <a-sphere color="#e8d070" opacity="0.7" radius="0.01" position="0.2 0.02 -0.5"
      animation="property: position; from: 0.2 0.02 -0.5; to: 0.3 0.5 -0.5; dur: 3500; loop: true; easing: easeInSine"
    ></a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  function startAR() {
    document.getElementById('laadscherm').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('laadscherm').style.display = 'none';
      document.getElementById('arscene').style.display = 'block';
      document.getElementById('herhaal').style.display = 'block';
    }, 1000);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const marker = document.getElementById('marker');
    const vid = document.getElementById('vid');
    marker.addEventListener('markerFound', () => { vid.play().catch(() => {}); });
    marker.addEventListener('markerLost', () => { vid.pause(); });
  });
</script>
</body>
</html>
